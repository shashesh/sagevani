version: 2
updates:
  # --- website (npm) ---
  #
  # One update entry per package-ecosystem/directory pair (Dependabot
  # rejects duplicates of that pair). Major bumps stay ungrouped so each
  # lands as its own PR for review, held back only by the small flat
  # default-days cooldown. Minor/patch bumps are grouped by release
  # train and held back longer via semver-minor-days/semver-patch-days,
  # so they don't show up the moment a release drops.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    cooldown:
      default-days: 3
      semver-minor-days: 21
      semver-patch-days: 10
    groups:
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
        update-types:
          - "minor"
          - "patch"
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      test-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "@axe-core/playwright"
          - "vite-tsconfig-paths"
        update-types:
          - "minor"
          - "patch"
      lint-and-types:
        patterns:
          - "eslint"
          - "eslint-*"
          - "prettier"
          - "typescript"
          - "typescript-native"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      everything-else:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions ---
  #
  # `cooldown`'s semver-*-days keys aren't supported for this ecosystem,
  # so only the flat default-days applies; grouping still keeps minor/patch
  # actions bumps bundled while majors land individually.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
