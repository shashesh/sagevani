version: 2
updates:
  # --- website (npm) ---
  #
  # One update entry per package-ecosystem/directory pair (Dependabot
  # rejects duplicates of that pair). Most major bumps stay ungrouped so
  # each lands as its own PR for review, held back only by the small
  # flat default-days cooldown; minor/patch bumps are grouped by release
  # train and held back longer via semver-minor-days/semver-patch-days,
  # so they don't show up the moment a release drops. The payload and
  # vitest groups are the exception: their sibling packages must match
  # the core package's version exactly, so those two groups bundle every
  # semver level together, majors included (see groups below).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    cooldown:
      default-days: 3
      semver-minor-days: 21
      semver-patch-days: 10
    groups:
      # These two groups have no `update-types` filter: the sibling
      # packages must match the core package's version exactly (this is
      # what broke #25/#26 for payload and #32 for vitest), so they're
      # grouped on every semver level, majors included, not just minor/patch.
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vite"
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      playwright-tooling:
        patterns:
          - "@playwright/test"
          - "@axe-core/playwright"
          - "vite-tsconfig-paths"
        update-types:
          - "minor"
          - "patch"
      lint-and-types:
        patterns:
          - "eslint"
          - "eslint-*"
          - "prettier"
          - "typescript"
          - "typescript-native"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      everything-else:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions ---
  #
  # `cooldown`'s semver-*-days keys aren't supported for this ecosystem,
  # so only the flat default-days applies; grouping still keeps minor/patch
  # actions bumps bundled while majors land individually.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
